<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrisisFusion · 独立地图插件</title><link rel="stylesheet" href="static/vendor/leaflet/leaflet.css"><link rel="stylesheet" href="static/shell.css"><link rel="stylesheet" href="static/geo.css"></head>
<body><header><span class="brand">CRISISFUSION <b>MAP</b></span><span>独立插件 v1.0.0 · LA County</span></header><main><details class="panel host-input"><summary>接入通话 / 独立测试</summary><p>宿主通常通过 API 发送通话快照。也可在此手动测试：每次修改使用更大的修订号，同一修订号只接受完全相同的重复提交。不会自动调用地址查询或获取位置。</p><form id="host-call-form"><div class="form-row"><label>Call ID<input name="call_id" required pattern="[A-Za-z0-9][A-Za-z0-9_.:\-]{0,127}" value="demo-call-1"></label><label>修订号<input name="revision" required type="number" min="1" value="1"></label><label>语言<select name="language"><option value="en">English</option><option value="es">Español</option><option value="zh">中文</option></select></label></div><label>完整通话原文<textarea name="text" required maxlength="100000" placeholder="例如：I am at 123 Main St, Los Angeles."></textarea></label><button class="primary" type="submit">保存通话快照</button><p id="host-message" role="status"></p></form><p class="geo-note">设备定位只对宿主明确标记为活动的通话开放；本表单不会自动标记通话活动。API 接口和嵌入方法见随包 README。</p></details><div id="plugin-root"></div></main><script src="static/vendor/leaflet/leaflet.js"></script><script src="static/geo.js"></script></body></html>
