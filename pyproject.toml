[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dualuse*", "crisisfusion_map*", "crisisfusion_scoring*"]

[tool.setuptools.package-data]
crisisfusion_map = ["plugin.json", "static/*", "static/vendor/leaflet/*", "data/*"]
crisisfusion_scoring = ["plugin.json", "static/*"]

[project]
name = "dualuse"
version = "0.1.0"
description = "Dual-Use Hackathon (InnovateLA, USC, 2026-10-16 to 18) build"
requires-python = ">=3.14"
dependencies = [
    # Service and demo
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "httpx",
    "pydantic",
    "python-dotenv",
    # Partner and model APIs
    "anthropic",
    "retell-sdk",
    # Data and maps
    "numpy",
    "pandas",
    "plotly",
    "pydeck",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
